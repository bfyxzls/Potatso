name: Build unsigned iOS IPA

# 用法：
#   1. Fork https://github.com/Jstrom2022/potatso-Swift 到你自己的 GitHub 账号
#   2. 把本文件放到 fork 仓库的 .github/workflows/build-ipa.yml
#   3. 进入仓库 Actions 页 -> 左侧 "Build unsigned iOS IPA" -> Run workflow
#   4. 构建完成后在该次运行的 Artifacts 里下载 potatso-Swift-unsigned-ipa
#
# 产物是「未签名」的 .ipa，需要再用爱思助手自签后才能装进 iPhone。
# 本流程不接触、也不需要你的 Apple ID 或任何证书。

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-ipa:
    # macos-15 runner 自带 Xcode 16.x，可编译 deploymentTarget 17.0 的工程
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive without code signing
        run: |
          xcodebuild archive \
            -project potatso.xcodeproj \
            -scheme potatso \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/potatso.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/potatso.xcarchive/Products/Applications/potatso.app"
          if [ ! -d "$APP" ]; then
            echo "未找到 potatso.app，归档目录内容如下："
            find "$RUNNER_TEMP/build/potatso.xcarchive/Products" -maxdepth 3
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry potatso-Swift-unsigned.ipa Payload
          echo "--- 产物信息 ---"
          ls -lh potatso-Swift-unsigned.ipa
          unzip -l potatso-Swift-unsigned.ipa | head -20
          echo "--- 版本信息 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: potatso-Swift-unsigned-ipa
          path: ${{ runner.temp }}/ipa/potatso-Swift-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Write summary
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "- 产物：\`potatso-Swift-unsigned.ipa\`（未签名）"
            echo "- 下载方式：本页面底部 **Artifacts** 区域"
            echo "- 下一步：用爱思助手的「IPA 签名」功能自签后安装到 iPhone"
          } >> "$GITHUB_STEP_SUMMARY"
